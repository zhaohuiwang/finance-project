# Sector Rotation Monitor Configuration
# =====================================

benchmark: SPY

# Broad GICS sector ETFs (Select Sector SPDRs)
sectors:
  XLK:
    name: Technology
    gics: Information Technology
    style: Growth / Cyclical
    group: sector
  XLF:
    name: Financials
    gics: Financials
    style: Cyclical
    group: sector
  XLV:
    name: Health Care
    gics: Health Care
    style: Defensive
    group: sector
  XLE:
    name: Energy
    gics: Energy
    style: Cyclical / Commodity
    group: sector
  XLI:
    name: Industrials
    gics: Industrials
    style: Cyclical
    group: sector
  XLY:
    name: Consumer Discretionary
    gics: Consumer Discretionary
    style: Cyclical
    group: sector
  XLU:
    name: Utilities
    gics: Utilities
    style: Defensive
    group: sector
  XLC:
    name: Communication Services
    gics: Communication Services
    style: Mixed
    group: sector
  XLP:
    name: Consumer Staples
    gics: Consumer Staples
    style: Defensive
    group: sector
  XLRE:
    name: Real Estate
    gics: Real Estate
    style: Interest-rate sensitive
    group: sector
  XLB:
    name: Materials
    gics: Materials
    style: Cyclical / Commodity
    group: sector

# Industry / thematic ETFs (finer-grained rotation)
industries:
  SMH:
    name: Semiconductors
    parent_sector: XLK
    style: Growth / Cyclical
    group: industry
  IGV:
    name: Software
    parent_sector: XLK
    style: Growth
    group: industry
  XBI:
    name: Biotech
    parent_sector: XLV
    style: Growth / Speculative
    group: industry
  KBE:
    name: Banks
    parent_sector: XLF
    style: Cyclical / Rate-sensitive
    group: industry
  KRE:
    name: Regional Banks
    parent_sector: XLF
    style: Cyclical / Rate-sensitive
    group: industry
  XHB:
    name: Homebuilders
    parent_sector: XLY
    style: Cyclical / Rate-sensitive
    group: industry
  XRT:
    name: Retail
    parent_sector: XLY
    style: Cyclical
    group: industry
  ITA:
    name: Aerospace & Defense
    parent_sector: XLI
    style: Cyclical / Government
    group: industry
  XTN:
    name: Transportation
    parent_sector: XLI
    style: Cyclical
    group: industry
  XES:
    name: Oil Equipment & Services
    parent_sector: XLE
    style: Cyclical / Commodity
    group: industry
  XSD:
    name: Semiconductor (SPDR)
    parent_sector: XLK
    style: Growth / Cyclical
    group: industry
  IBB:
    name: Biotechnology (iShares)
    parent_sector: XLV
    style: Growth / Speculative
    group: industry

# Performance lookback periods (trading days approx)
periods:
  "1D": 1
  "1W": 5
  "1M": 21
  "3M": 63
  "6M": 126
  "YTD": null
  "1Y": 252

# RRG / Relative Strength parameters
rrg:
  rs_lookback: 63
  momentum_lookback: 21
  normalize: true

# FRED macro overlay
fred:
  enabled: true
  series:
    UNRATE:
      name: Unemployment Rate
      category: labor
      higher_is: worse
    ICSA:
      name: Initial Jobless Claims
      category: labor
      higher_is: worse
    CPIAUCSL:
      name: CPI All Items
      category: inflation
      higher_is: mixed
    CPILFESL:
      name: Core CPI (ex Food & Energy)
      category: inflation
      higher_is: mixed
    T10Y2Y:
      name: 10Y-2Y Treasury Spread
      category: rates
      higher_is: better
    DFF:
      name: Fed Funds Effective Rate
      category: rates
      higher_is: mixed
    INDPRO:
      name: Industrial Production
      category: activity
      higher_is: better
    UMCSENT:
      name: UMich Consumer Sentiment
      category: sentiment
      higher_is: better
    TCU:
      name: Capacity Utilization
      category: activity
      higher_is: better
  lookback_months: 36

# Classic sector preferences by cycle phase (heuristic)
cycle_sector_preferences:
  Early Expansion:
    favored: [XLF, XLY, XLI, XLK, XLB]
    avoided: [XLU, XLP, XLV]
  Mid Expansion:
    favored: [XLK, XLI, XLY, XLC]
    avoided: [XLU, XLP]
  Late Expansion:
    favored: [XLE, XLB, XLI, XLF]
    avoided: [XLK, XLY]
  Slowdown:
    favored: [XLP, XLU, XLV]
    avoided: [XLY, XLK, XLB]
  Recession / Contraction:
    favored: [XLP, XLU, XLV]
    avoided: [XLE, XLB, XLY, XLF]

# Data settings
data:
  history_period: "2y"
  cache_dir: "data"
  cache_ttl_hours: 6
  include_industries: true

# Output
output:
  dir: "outputs"
  generate_html: true
  generate_csv: true
