trading:
  paper_trading: true          # Set to false for live real-money trading
  trade_only_market_hours: false  # Set to true to restrict to 9:30–16:00 ET
  symbols: ["NBIS"]           # Add more tickers: ["NBIS", "AAPL", "TSLA"]
  timeframe: "minute"          # Options: minute, hour, day
  check_interval: 60           # Seconds between each trading loop iteration
  log_file: "logs/trade_log.csv"
  sector_etfs:                 # maps each symbol to its sector ETF (used by agent_trader.py)
    NBIS: "AIQ"                # NBIS is biotech → Global X Artificial Intelligence & Technology ETF. Broad Tech: Technology Select Sector SPDR ETF (XLK) or Vanguard Information Technology ETF (VGT).AI & Cloud Infrastructure: Global X Artificial Intelligence & Technology ETF (AIQ) or First Trust Cloud Computing ETF (SKYY).
  earnings_blackout_days: 2    # skip BUY within this many days of earnings (0 to disable)

strategy:
  fast_ma: 3                   # Fast SMA window (smaller = more responsive, more noise)
  slow_ma: 8                   # Slow SMA window (larger = smoother, more lag)
  
  use_regular_hours_only: true # Set false to include pre/after-hours in ma calculations and signals
  market_open_time: "09:30"    # 
  market_close_time: "16:00"   #

  rsi_period: 14
  rsi_max_for_buy: 75          # Only buy when RSI is below this threshold
  volume_min_ratio: 1.0        # BUY only if current volume >= X × 20-bar avg (0 to disable)
  use_5m_confirmation: true    # Require 5-min uptrend before taking a 1-min BUY signal
  min_signal_confidence: 0.65  # smart_ma.py only: skip signal if Claude's confidence is below this

# the fast_ma and slow_ma calculations include after-hours data. Alpaca’s StockBarsRequest by default returns all bars, including pre-market and after-hours sessions when using minute/hour timeframes.

risk:
  risk_per_trade: 0.01         # Fraction of equity to risk per trade (1%)
  max_position_pct: 0.10       # Max fraction of equity in any single position (10%)
  stop_loss_pct: 0.015         # Initial stop loss distance from entry (1.5%)
  trailing_stop_pct: 0.03      # Trailing stop percentage (3%)
  take_profit_pct: 0.06        # Take profit target; set to null to rely solely on trailing stop
  daily_max_loss_pct: 0.03     # Halt trading for the day if equity drops more than 3%
  stop_loss_cooldown_minutes: 30  # Block re-entry for this many minutes after a stop loss fires
  
  # ATR-based trailing stops
  atr_period: 14                 # Standard ATR period
  atr_multiplier: 2.5            # Stop distance = ATR × 2.5 [2.0, 2.5, 3.0, 3.5] the higher the multiplier, the wider the stop loss, which can reduce false stop-outs in volatile markets but also increases risk.
  trailing_stop_enabled: true    # Set to false to disable dynamic trailing
  trail_update_interval_minutes: 5   # How often to adjust the trailing stop
  use_wilder_atr: true           # Recommended: true (Wilder's Smoothed ATR)



# ATR (Average True Range). Simple ATR (Rolling Mean) and Wilder's Smoothed ATR (Gives more weight to recent data)