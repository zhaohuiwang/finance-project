[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
py-modules = ["config"]

[project]
name = "alpaca"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alpaca-py>=0.43.4",
    "anthropic>=0.50.0",
    "python-dotenv>=1.0",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "ta-lib>=0.6.8",
    "yfinance>=0.2.58",
    "black>=26.5.1",
]

[tool.pyright]
pythonVersion = "3.13"
extraPaths = ["src"]
