
# schwab-trader/conf/bot3_conf.yaml

# To change the dashboard port(from 8050 to 8051)
# How you run             Where to change
# Manual terminal         --port 8051 on the command linesy
# stemd service           ExecStart=... --port 8051
# New permanent default   default=8051 in bot3.py

# Stop loss orders with loss dollar/pct parameters is based on actual buy price from Schwab if exist otherwise buy_target_price. stop_loss_dollar preceeds stop_loss_pct. Stop loss order is set as duration: "GOOD_TILL_CANCEL", all other orders are duration: "DAY"
symbols:
    WDC:
      fixed_shares: 200
      
      buy_target_price: 465.1

      trail_activation_price: 497  # threshold to trigger trailing sell order
      trail_offset_pct: 0.2       # minimal 0.1, trail sell by % from high
      limit_sell_price: 595.5     # hard take-profit limit

      stop_loss_dollar: 0
      stop_loss_pct: 5.0            # ignored while dollar > 0
      
      buy_drop_pct: 5.0              

    
    MU:
      fixed_shares: 49
      
      buy_target_price: 960.1

      trail_activation_price: 988   # threshold to trigger trailing sell order
      trail_offset_pct: 0.2           # trail sell by % from high
      limit_sell_price: 1200         # hard take-profit limit

      stop_loss_dollar: 50
      stop_loss_pct: 8.0            # ignored while dollar > 0
      
      buy_drop_pct: 5.0 



risk:
  risk_per_trade_pct: 1.0
  max_positions: 4
  min_account_equity: 5000.0
  max_daily_loss_pct: 3.0
  default_shares: 1

# Auto-shutdown configuration
# auto_shutdown_after_close: False
# shutdown_buffer_minutes: 2
# shutdown_on_weekends: true
