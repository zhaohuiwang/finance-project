
# schwab-trader/conf/bot3_conf.yaml

symbols:
    WDC:
      buy_target_price: 428.5
      trail_activation_price: 433.5   # threshold to trigger trailing sell order
      trail_offset_pct: 0.01           # trail sell by % from high

      limit_sell_price: 485.5         # hard take-profit limit
      stop_loss_dollar: 5.0
      buy_drop_pct: 10.0              # ignored while dollar > 0
      limit_sell_pct: 8.0
      stop_loss_pct: 8.0
      fixed_shares: 200
    
    # MU:
    #   buy_target_price: 850.5
    #   trail_activation_price: 950.5   # threshold to trigger trailing sell order
    #   trail_offset_pct: 2.5           # trail sell by 2.5% from high

    #   limit_sell_price: 980.5         # hard take-profit limit
    #   stop_loss_dollar: 50.0
    #   buy_drop_pct: 10.0
    #   limit_sell_pct: 8.0
    #   stop_loss_pct: 8.0
    #   fixed_shares: 49


risk:
  risk_per_trade_pct: 1.0
  max_positions: 4
  min_account_equity: 5000.0
  max_daily_loss_pct: 3.0
  default_shares: 1

# Auto-shutdown configuration
auto_shutdown_after_close: False
shutdown_buffer_minutes: 2
shutdown_on_weekends: true
