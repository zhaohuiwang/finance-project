
# schwab-trader/conf/bot4_config.yaml

risk:
  min_account_equity: 5000
  max_positions: 4

auto_shutdown_after_close: true
shutdown_buffer_minutes: 2

symbols:
  MU:
    # Position size.
    fixed_shares: 50        
    # How much the stock must rise from the previous day’s close or day low to trigger a sell setup.
    momentum_up_pct: 5.0    
    # Trailing stop distance for the sell order.
    trailing_sell_pct: 1.0  
    # How far price must drop from the last sell price to trigger a buy setup
    pullback_buy_pct: 3.0   
    # Trailing stop distance for the buy order.
    trailing_buy_pct: 1.5   

  WDC:
    fixed_shares: 100
    momentum_up_pct: 5.0
    trailing_sell_pct: 1.0
    pullback_buy_pct: 3.0
    trailing_buy_pct: 1.5


# Bot4 Strategy (Trailing Momentum / Pullback)
# This is a momentum breakout + pullback re-entry system that relies almost entirely on trailing-stop orders for both sides.
#   a. Core evaluation (on every price tick via ensure_trailing_strategy):

#       <>  Computes base = min(previous close, day low).
#       <>  % up = (current price - base) / base x 100.
#       <>  Tracks last sell price (restored from DB on restart).

#   b. Three mutually exclusive actions:

#       1. Momentum Sell setup (no position, no open sell):
#           If % up ≥ momentum_up_pct → place trailing-stop sell for fixed_shares with offset = trailing_sell_pct (percent of last price, basis LAST).

#       2. Pullback Buy setup (has recorded last sell, no position, no open buy):
#           If price has dropped ≥ pullback_buy_pct from last sell → place trailing-stop buy for fixed_shares with offset = trailing_buy_pct.

#       3. Protect existing position:
#           If holding shares and no open sell → place trailing-stop sell on the full position size (using trailing_sell_pct).


#   c.  Supporting features

#   d.  Config style: purely percentage-driven (momentum_up_pct, trailing_sell_pct, pullback_buy_pct, trailing_buy_pct) + fixed share size. No hard price targets or classic stop-loss percentages.