
# schwab-trader/conf/bot4_config.yaml

risk:
  min_account_equity: 5000
  max_positions: 4

auto_shutdown_after_close: true
shutdown_buffer_minutes: 2

symbols:
  MU:
    # Position size.
    fixed_shares: 50        
    # How much the stock must rise from the previous day’s close or day low to trigger a sell setup.
    momentum_up_pct: 5.0    
    # Trailing stop distance for the sell order.
    trailing_sell_pct: 1.0  
    # How far price must drop from the last sell price to trigger a buy setup
    pullback_buy_pct: 3.0   
    # Trailing stop distance for the buy order.
    trailing_buy_pct: 1.5   

  WDC:
    fixed_shares: 100
    momentum_up_pct: 5.0
    trailing_sell_pct: 1.0
    pullback_buy_pct: 3.0
    trailing_buy_pct: 1.5
  
  NBIS:
    fixed_shares: 100
    momentum_up_pct: 5.0
    trailing_sell_pct: 1.0
    pullback_buy_pct: 3.0
    trailing_buy_pct: 1.5



#################################################################
# Bot4 Strategy (Trailing Momentum / Pullback)
#################################################################

# On every price update the bot evaluates three mutually exclusive situations:
# 1. Momentum Sell Setup
#     Conditions:
#      <> No current position
#      <> No open SELL order
#      <> Price has risen ≥ momentum_up_pct from the base, where
#        (base = min(previous close, day low))

#     Action:
#      ! Place a trailing-stop SELL for fixed_shares with offset = trailing_sell_pct.
#     : This tries to catch a strong upward move and lock in profits as the price climbs.

# 2. Pullback Buy Setup (after a sell)
#     Conditions:
#      <>  Has a recorded last_sell_price
#      <> No current position
#      <> No open BUY order
#      <> Price has dropped ≥ pullback_buy_pct from the last sell price

#     Action:
#      ! Place a trailing-stop BUY for fixed_shares with offset = trailing_buy_pct.
#     : This tries to buy the dip after a previous profitable (or any) sale.
# 3. Protect Existing Position
#     Conditions:
#      <> Currently holding shares
#      <> No open SELL order

#     Action:
#      ! Place a trailing-stop SELL on the full position size using trailing_sell_pct.
#     : Always keeps a protective trailing stop on any open long position.