
# schwab-trader/conf/bot/conf.yaml


# Sell limit: limit_sell_price or buy_price * (1 + limit_sell_pct)
# 

symbols:

  NBIS:
    buy_target_price: 176
    buy_drop_pct: 10.0

    limit_sell_price: 176.5
    limit_sell_pct: 10.0 

    stop_loss_dollar: 10   
    stop_loss_pct: 10

    fixed_shares: 500

  # JOBY:

  # IREN:

  #  CRWV:

  # USAR:    


risk:
  risk_per_trade_pct: 1.0
  max_positions: 4
  min_account_equity: 5000.0
  max_daily_loss_pct: 3.0
  default_shares: 1

# Auto-shutdown configuration
auto_shutdown_after_close: True
shutdown_buffer_minutes: 2
shutdown_on_weekends: true
