[project]
name = "f_canvas"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.32.5",
    "tzdata>=2025.3",
    "websockets>=16.0",
    "cryptography>=46.0",
    "aiohttp>=3.13",
    "selenium>=4.40.0",
    "dotenv>=0.9.9",
    "yfinance>=1.1.0",
    "xarray>=2026.1.0",
    "matplotlib>=3.10.8",
    "seaborn>=0.13.2",
    "pydantic>=2.12.5",
    "ipykernel>=7.2.0",
    "black>=26.1.0",
    "pandas>=3.0.1",
]

[tool.black]    # Black for code formatting
line-length = 88

[tool.isort]    # isort for import sorting
profile = "black"

[tool.uv]
package = false
# root project is environment-only, not a package.

